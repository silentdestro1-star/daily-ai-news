name: Daily AI Digest

on:
  schedule:
    # Runs every day at 6:00 AM UTC (adjust the hour for your timezone)
    # Cron format: minute hour day-of-month month day-of-week
    - cron: "0 4 * * *"
  workflow_dispatch:  # Lets you click "Run workflow" to test manually

permissions:
  contents: write  # Required to commit the digest back to your repo

jobs:
  build-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No extra packages needed — we use only standard library

      - name: Run digest script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python digest.py

      - name: Commit and push digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          git diff --staged --quiet || git commit -m "📰 Daily digest: $(date -u +%F)"
          git push